<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Card Splitter v0.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+KR:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html, body {
  height: 100%;
  background: radial-gradient(ellipse at 50% 30%, #161228 0%, #060810 70%);
  font-family: 'Noto Sans KR', sans-serif;
  color: #e0e0e8;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.step { position: fixed; inset: 0; display: none; }
.step.active { display: flex; }

/* ── STEP 1: 드롭존 ── */
#step-drop { flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.app-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: 3px;
  color: rgba(255,255,255,0.85);
}
.app-sub { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
#dropzone {
  width: min(420px, 86vw);
  aspect-ratio: 3/4;
  max-height: 52vh;
  border: 2px dashed rgba(127,119,221,0.4);
  border-radius: 18px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  color: rgba(255,255,255,0.35);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  line-height: 1.7;
}
#dropzone:hover, #dropzone.over {
  border-color: #7F77DD;
  background: rgba(127,119,221,0.08);
  color: rgba(255,255,255,0.6);
}
#dropzone .ico { font-size: 34px; opacity: 0.5; }

/* ── STEP 2: 아트창 조정 ── */
#step-adjust { flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
#adjust-wrap { position: relative; touch-action: none; }
#adjust-canvas { display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
#overlay-svg { position: absolute; inset: 0; pointer-events: none; }
.handle {
  position: absolute;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: rgba(127,119,221,0.9);
  border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  cursor: grab;
  touch-action: none;
}
.adjust-hint { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; line-height: 1.6; }
.btn-primary {
  font-size: 14px; font-weight: 700;
  padding: 13px 38px;
  border-radius: 26px;
  border: none;
  background: linear-gradient(135deg, #7F77DD, #5a50c8);
  color: #fff;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  box-shadow: 0 4px 18px rgba(127,119,221,0.35);
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.96); }
.btn-ghost {
  font-size: 11px;
  padding: 8px 18px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.45);
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}

/* ── STEP 3: 처리중 ── */
#step-process { flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(127,119,221,0.2);
  border-top-color: #7F77DD;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#process-msg { font-size: 12px; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.8; }
#process-detail { font-size: 10px; color: rgba(255,255,255,0.25); }

/* ── STEP 4: 뷰어 ── */
#step-viewer { align-items: center; justify-content: center; perspective: 1000px; }
#stage { position: relative; transform-style: preserve-3d; will-change: transform; }
#pixi-canvas { width: 100%; height: 100%; display: block; border-radius: 14px; }
.card-shadow {
  position: absolute; inset: 12px -6px -16px -6px;
  border-radius: 26px;
  background: rgba(0,0,0,0.55);
  filter: blur(26px);
  z-index: -1;
}
#fab {
  position: fixed;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(20,20,34,0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: rgba(255,255,255,0.7);
  font-size: 19px;
  display: none;
  align-items: center; justify-content: center;
  cursor: pointer; z-index: 50;
}
#fab.show { display: flex; }
#backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s; z-index: 60;
}
#backdrop.show { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: rgba(18,18,30,0.93);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 10px 22px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(105%);
  transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  z-index: 70; max-height: 74vh; overflow-y: auto;
}
#sheet.show { transform: translateY(0); }
.sheet-handle { width: 38px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 4px auto 16px; }
.ctrl-section { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.ctrl-label { font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,0.28); font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }
.btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 8px 16px; border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.45);
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
}
.chip.on { background: rgba(127,119,221,0.28); border-color: #7F77DD; color: #c5c0ff; }
.sliders { display: flex; flex-direction: column; gap: 12px; }
.slider-row { display: flex; align-items: center; gap: 12px; font-size: 11px; }
.slider-row label { width: 88px; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; color: rgba(255,255,255,0.45); }
.slider-row input[type=range] { flex: 1; height: 4px; -webkit-appearance: none; background: rgba(255,255,255,0.12); border-radius: 2px; }
.slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #8F87E8; cursor: pointer; }
.slider-row .val { width: 34px; text-align: right; font-family: 'Rajdhani', sans-serif; color: rgba(255,255,255,0.55); }
.dl-row { display: flex; gap: 7px; flex-wrap: wrap; }
.err-box {
  position: fixed; left: 50%; bottom: 24px;
  transform: translateX(-50%);
  background: rgba(180,50,50,0.92);
  color: #fff; font-size: 11px;
  padding: 10px 18px; border-radius: 12px;
  z-index: 100; max-width: 86vw; line-height: 1.5;
  display: none;
}
</style>
</head>
<body>

<!-- STEP 1 -->
<div class="step active" id="step-drop">
  <div class="app-title">CARD SPLITTER</div>
  <div class="app-sub">일체형 카드 → 테두리 / 캐릭터 / 배경 자동 분리</div>
  <div id="dropzone">
    <span class="ico">🃏</span>
    <span>카드 이미지를 드래그하거나<br>탭해서 선택</span>
    <input type="file" accept="image/*" id="file-input" style="display:none"/>
  </div>
  <div class="adjust-hint">처리는 전부 브라우저 안에서 이루어져요 (이미지 외부 전송 없음)<br>첫 실행 시 AI 모델 다운로드로 시간이 걸릴 수 있어요</div>
</div>

<!-- STEP 2 -->
<div class="step" id="step-adjust">
  <div class="adjust-hint">보라색 사각형을 <b>아트창(일러스트 영역)</b>에 맞춰주세요<br>모서리 핸들 드래그 · 안쪽 드래그로 이동</div>
  <div id="adjust-wrap">
    <canvas id="adjust-canvas"></canvas>
    <svg id="overlay-svg"></svg>
    <div class="handle" id="h-tl"></div>
    <div class="handle" id="h-tr"></div>
    <div class="handle" id="h-bl"></div>
    <div class="handle" id="h-br"></div>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn-ghost" id="btn-back">다시 선택</button>
    <button class="btn-primary" id="btn-split">분리 실행 ✦</button>
  </div>
</div>

<!-- STEP 3 -->
<div class="step" id="step-process">
  <div class="spinner"></div>
  <div id="process-msg">분리 중...</div>
  <div id="process-detail"></div>
</div>

<!-- STEP 4 -->
<div class="step" id="step-viewer">
  <div id="stage">
    <div class="card-shadow"></div>
    <canvas id="pixi-canvas"></canvas>
  </div>
</div>

<button id="fab">⚙</button>
<div id="backdrop"></div>
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="ctrl-section">
    <span class="ctrl-label">Mode</span>
    <div class="btn-row">
      <button class="chip on" id="m-mouse">터치</button>
      <button class="chip" id="m-gyro">자이로</button>
      <button class="chip" id="m-spin">자동회전</button>
    </div>
  </div>
  <div class="ctrl-section">
    <span class="ctrl-label">Tuning</span>
    <div class="sliders">
      <div class="slider-row"><label>Parallax</label><input type="range" min="0" max="200" value="100" id="s-px"/><span class="val" id="v-px">100</span></div>
      <div class="slider-row"><label>Tilt Angle</label><input type="range" min="0" max="200" value="100" id="s-tilt"/><span class="val" id="v-tilt">100</span></div>
      <div class="slider-row"><label>Holo Border</label><input type="range" min="0" max="200" value="100" id="s-holo"/><span class="val" id="v-holo">100</span></div>
      <div class="slider-row"><label>Glare</label><input type="range" min="0" max="200" value="100" id="s-glare"/><span class="val" id="v-glare">100</span></div>
      <div class="slider-row"><label>Sparkles</label><input type="range" min="0" max="200" value="100" id="s-spark"/><span class="val" id="v-spark">100</span></div>
    </div>
  </div>
  <div class="ctrl-section">
    <span class="ctrl-label">Layers · PNG 저장</span>
    <div class="dl-row">
      <button class="chip" id="dl-frame">테두리</button>
      <button class="chip" id="dl-char">캐릭터</button>
      <button class="chip" id="dl-bg">배경</button>
    </div>
  </div>
  <div class="ctrl-section">
    <div class="btn-row">
      <button class="chip" id="btn-new">새 이미지 분리</button>
    </div>
  </div>
</div>

<div class="err-box" id="err-box"></div>

<script type="importmap">
{ "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.mjs" } }
</script>

<script type="module">
import { Application, Container, Sprite, Graphics, Assets, Filter, GlProgram } from 'pixi.js';

/* ═══════════════ 상태 ═══════════════ */
let srcImg = null;          // 원본 Image
let srcCanvas = null;       // 작업 해상도 캔버스
let win = { x: 0.07, y: 0.13, w: 0.86, h: 0.62 };  // 아트창 (정규화 좌표)
let layers = { frame: null, char: null, bg: null }; // 결과 캔버스
const MAX_SRC = 1500;       // 작업 해상도 상한 (세로)
const EXT_RATIO = 0.09;     // 아트 가장자리 확장 비율 (아트창 대비)

const $ = id => document.getElementById(id);
const steps = ['drop','adjust','process','viewer'];
function showStep(name) {
  steps.forEach(s => $('step-'+s).classList.toggle('active', s === name));
  $('fab').classList.toggle('show', name === 'viewer');
}
function showErr(msg, ms = 6000) {
  const e = $('err-box');
  e.textContent = msg; e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', ms);
}

/* ═══════════════ STEP 1: 입력 ═══════════════ */
const dz = $('dropzone');
dz.addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    srcImg = img;
    // 작업 해상도 캔버스
    const sc = Math.min(1, MAX_SRC / img.height);
    srcCanvas = document.createElement('canvas');
    srcCanvas.width  = Math.round(img.width * sc);
    srcCanvas.height = Math.round(img.height * sc);
    srcCanvas.getContext('2d').drawImage(img, 0, 0, srcCanvas.width, srcCanvas.height);
    initAdjust();
    showStep('adjust');
  };
  img.onerror = () => showErr('이미지를 불러올 수 없어요.');
  img.src = url;
}

/* ═══════════════ STEP 2: 아트창 조정 ═══════════════ */
const aCanvas = $('adjust-canvas');
const aWrap = $('adjust-wrap');
let dispW = 0, dispH = 0;

function initAdjust() {
  const availW = window.innerWidth * 0.86;
  const availH = window.innerHeight * 0.62;
  const s = Math.min(availW / srcCanvas.width, availH / srcCanvas.height);
  dispW = Math.round(srcCanvas.width * s);
  dispH = Math.round(srcCanvas.height * s);
  aCanvas.width = dispW; aCanvas.height = dispH;
  aCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, dispW, dispH);
  aWrap.style.width = dispW + 'px';
  aWrap.style.height = dispH + 'px';
  drawOverlay();
}

function drawOverlay() {
  const svg = $('overlay-svg');
  svg.setAttribute('width', dispW);
  svg.setAttribute('height', dispH);
  const x = win.x * dispW, y = win.y * dispH, w = win.w * dispW, h = win.h * dispH;
  svg.innerHTML = `
    <path d="M0,0 H${dispW} V${dispH} H0 Z M${x},${y} V${y+h} H${x+w} V${y} Z"
          fill="rgba(10,8,24,0.55)" fill-rule="evenodd"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}"
          fill="none" stroke="#8F87E8" stroke-width="2" stroke-dasharray="7 5" rx="6"/>
  `;
  const set = (id, hx, hy) => {
    const el = $(id);
    el.style.left = hx + 'px';
    el.style.top  = hy + 'px';
  };
  set('h-tl', x, y);     set('h-tr', x+w, y);
  set('h-bl', x, y+h);   set('h-br', x+w, y+h);
}

// 핸들 / 이동 드래그
let drag = null;
function ptIn(e) {
  const r = aWrap.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx / dispW, y: cy / dispH };
}
['h-tl','h-tr','h-bl','h-br'].forEach(id => {
  const start = e => { e.preventDefault(); e.stopPropagation(); drag = { type: id }; };
  $(id).addEventListener('mousedown', start);
  $(id).addEventListener('touchstart', start, { passive: false });
});
const startMove = e => {
  const p = ptIn(e);
  if (p.x > win.x && p.x < win.x+win.w && p.y > win.y && p.y < win.y+win.h) {
    e.preventDefault();
    drag = { type: 'move', ox: p.x - win.x, oy: p.y - win.y };
  }
};
aWrap.addEventListener('mousedown', startMove);
aWrap.addEventListener('touchstart', startMove, { passive: false });

const onMove = e => {
  if (!drag) return;
  e.preventDefault();
  const p = ptIn(e);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const MIN = 0.15;
  if (drag.type === 'move') {
    win.x = clamp(p.x - drag.ox, 0, 1 - win.w);
    win.y = clamp(p.y - drag.oy, 0, 1 - win.h);
  } else {
    const x2 = win.x + win.w, y2 = win.y + win.h;
    if (drag.type === 'h-tl') {
      win.x = clamp(p.x, 0, x2 - MIN); win.y = clamp(p.y, 0, y2 - MIN);
      win.w = x2 - win.x; win.h = y2 - win.y;
    } else if (drag.type === 'h-tr') {
      win.y = clamp(p.y, 0, y2 - MIN);
      win.w = clamp(p.x, win.x + MIN, 1) - win.x; win.h = y2 - win.y;
    } else if (drag.type === 'h-bl') {
      win.x = clamp(p.x, 0, x2 - MIN);
      win.w = x2 - win.x; win.h = clamp(p.y, win.y + MIN, 1) - win.y;
    } else if (drag.type === 'h-br') {
      win.w = clamp(p.x, win.x + MIN, 1) - win.x;
      win.h = clamp(p.y, win.y + MIN, 1) - win.y;
    }
  }
  drawOverlay();
};
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('touchend', () => drag = null);

$('btn-back').addEventListener('click', () => showStep('drop'));

/* ═══════════════ STEP 3: 분리 파이프라인 ═══════════════ */
$('btn-split').addEventListener('click', runSplit);

function setMsg(m, d = '') { $('process-msg').innerHTML = m; $('process-detail').textContent = d; }

async function runSplit() {
  showStep('process');
  try {
    const W = srcCanvas.width, H = srcCanvas.height;
    const wx = Math.round(win.x * W), wy = Math.round(win.y * H);
    const ww = Math.round(win.w * W), wh = Math.round(win.h * H);
    const EXT = Math.round(Math.min(ww, wh) * EXT_RATIO);

    /* ── 1. 테두리: 아트창 내부 투명 처리 ── */
    setMsg('테두리 추출 중...');
    await tick();
    const frame = mkCanvas(W, H);
    const fctx = frame.getContext('2d');
    fctx.drawImage(srcCanvas, 0, 0);
    fctx.globalCompositeOperation = 'destination-out';
    roundRectPath(fctx, wx, wy, ww, wh, 8);
    fctx.fill();
    fctx.globalCompositeOperation = 'source-over';
    layers.frame = frame;

    /* ── 2. 아트: 창 내부 + 가장자리 스미어 확장 (테두리 밑으로 들어갈 여유분) ── */
    setMsg('아트 영역 확장 중...');
    await tick();
    const art = mkCanvas(ww + EXT*2, wh + EXT*2);
    const actx = art.getContext('2d');
    actx.drawImage(srcCanvas, wx, wy, ww, wh, EXT, EXT, ww, wh);
    // 가장자리 1px 슬라이스를 바깥으로 늘려서 채움 (smear outpaint)
    actx.drawImage(srcCanvas, wx, wy, ww, 1,  EXT, 0,        ww, EXT);        // top
    actx.drawImage(srcCanvas, wx, wy+wh-1, ww, 1, EXT, EXT+wh, ww, EXT);      // bottom
    actx.drawImage(srcCanvas, wx, wy, 1, wh,  0, EXT,        EXT, wh);        // left
    actx.drawImage(srcCanvas, wx+ww-1, wy, 1, wh, EXT+ww, EXT, EXT, wh);      // right
    // 네 모서리
    actx.drawImage(srcCanvas, wx, wy, 1, 1, 0, 0, EXT, EXT);
    actx.drawImage(srcCanvas, wx+ww-1, wy, 1, 1, EXT+ww, 0, EXT, EXT);
    actx.drawImage(srcCanvas, wx, wy+wh-1, 1, 1, 0, EXT+wh, EXT, EXT);
    actx.drawImage(srcCanvas, wx+ww-1, wy+wh-1, 1, 1, EXT+ww, EXT+wh, EXT, EXT);

    /* ── 3. 캐릭터: AI 누끼 (브라우저 ONNX) ── */
    setMsg('AI 캐릭터 분리 중...', '첫 실행은 모델 다운로드로 30초~2분 걸릴 수 있어요');
    await tick();
    let charCanvas;
    try {
      const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
      const artBlob = await new Promise(res => art.toBlob(res, 'image/png'));
      const outBlob = await removeBackground(artBlob, {
        progress: (key, cur, total) => {
          if (key.startsWith('fetch')) setMsg('AI 모델 다운로드 중...', `${Math.round(cur/total*100)}%`);
          else setMsg('AI 캐릭터 분리 중...', '연산 중 (기기 성능에 따라 수십 초)');
        }
      });
      const rawChar = await blobToCanvas(outBlob, art.width, art.height);
      setMsg('마스크 정제 중...', '알파 경화 + 구멍 메우기 + 파편 제거');
      await tick();
      charCanvas = refineChar(art, rawChar);
    } catch (err) {
      console.error(err);
      showErr('AI 누끼 실패: ' + (err.message || err) + ' — 네트워크 또는 브라우저 호환성 문제일 수 있어요.', 9000);
      // 폴백: 캐릭터 레이어 없이 진행 (배경만 parallax)
      charCanvas = mkCanvas(art.width, art.height);
    }
    layers.char = charCanvas;

    /* ── 4. 배경: 캐릭터 자리를 블러 스미어로 복원 ── */
    setMsg('배경 복원 중...');
    await tick();
    layers.bg = buildBg(art, charCanvas);

    /* ── 5. 뷰어 기동 ── */
    setMsg('뷰어 준비 중...');
    await tick();
    await launchViewer();
    showStep('viewer');
  } catch (err) {
    console.error(err);
    showErr('분리 실패: ' + (err.message || err), 9000);
    showStep('adjust');
  }
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tick() { return new Promise(r => setTimeout(r, 30)); }
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function blobToCanvas(blob, w, h) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = mkCanvas(w, h);
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(blob);
  });
}

/* 마스크 정제: 저대비 의상의 어중간한 알파를 복구
   1) 알파 경화  2) 외곽 플러드필로 내부 구멍 식별→메움  3) 작은 파편 제거
   4) RGB는 원본 아트에서 다시 채워 가장자리 변색 방지 */
function refineChar(art, rawChar) {
  const w = art.width, h = art.height, N = w * h;
  const rd = rawChar.getContext('2d').getImageData(0, 0, w, h).data;

  // 1) 알파 경화: 20~150 구간을 0~1로 확장, 0.18 이상이면 캐릭터
  const LO = 20, HI = 150;
  const mask = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const a = rd[i*4 + 3];
    const v = (a - LO) / (HI - LO);
    if (v > 0.18) mask[i] = 1;
  }

  // 2) 외곽 플러드필 → 바깥에 닿지 않는 투명 영역 = 내부 구멍 → 메움
  const outside = new Uint8Array(N);
  const stack = new Int32Array(N);
  let sp = 0;
  const push = idx => { if (!outside[idx] && !mask[idx]) { outside[idx] = 1; stack[sp++] = idx; } };
  for (let x = 0; x < w; x++) { push(x); push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { push(y*w); push(y*w + w - 1); }
  while (sp > 0) {
    const i = stack[--sp];
    const x = i % w, y = (i / w) | 0;
    if (x > 0)   push(i - 1);
    if (x < w-1) push(i + 1);
    if (y > 0)   push(i - w);
    if (y < h-1) push(i + w);
  }
  for (let i = 0; i < N; i++) if (!mask[i] && !outside[i]) mask[i] = 1;

  // 3) 작은 파편 제거 (면적 < 0.2% 컴포넌트 삭제)
  const seen = new Uint8Array(N);
  const minArea = Math.max(100, N * 0.002);
  const comp = new Int32Array(N);
  for (let i = 0; i < N; i++) {
    if (mask[i] && !seen[i]) {
      let cs = 0, head = 0;
      comp[cs++] = i; seen[i] = 1;
      while (head < cs) {
        const j = comp[head++];
        const x = j % w, y = (j / w) | 0;
        if (x > 0   && mask[j-1] && !seen[j-1]) { seen[j-1] = 1; comp[cs++] = j-1; }
        if (x < w-1 && mask[j+1] && !seen[j+1]) { seen[j+1] = 1; comp[cs++] = j+1; }
        if (y > 0   && mask[j-w] && !seen[j-w]) { seen[j-w] = 1; comp[cs++] = j-w; }
        if (y < h-1 && mask[j+w] && !seen[j+w]) { seen[j+w] = 1; comp[cs++] = j+w; }
      }
      if (cs < minArea) for (let k = 0; k < cs; k++) mask[comp[k]] = 0;
    }
  }

  // 4) 마스크 캔버스 + 1.5px 페더링
  const mcan = mkCanvas(w, h);
  const mctx = mcan.getContext('2d');
  const mim = mctx.createImageData(w, h);
  for (let i = 0; i < N; i++) {
    mim.data[i*4] = mim.data[i*4+1] = mim.data[i*4+2] = 255;
    mim.data[i*4+3] = mask[i] ? 255 : 0;
  }
  mctx.putImageData(mim, 0, 0);
  const soft = mkCanvas(w, h);
  const sctx = soft.getContext('2d');
  sctx.filter = 'blur(1.5px)';
  sctx.drawImage(mcan, 0, 0);
  sctx.filter = 'none';

  // 5) RGB는 원본 아트에서, 알파는 정제 마스크에서
  const out = mkCanvas(w, h);
  const octx = out.getContext('2d');
  octx.drawImage(art, 0, 0);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(soft, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  return out;
}

/* 배경 복원: 캐릭터 알파를 팽창시킨 마스크 영역만 강블러 이미지로 덮음 */
function buildBg(art, charCanvas) {
  const w = art.width, h = art.height;

  // 강블러 버전 (2-pass)
  const blur = mkCanvas(w, h);
  const bctx = blur.getContext('2d');
  bctx.filter = `blur(${Math.max(12, w*0.03)}px)`;
  bctx.drawImage(art, 0, 0);
  bctx.drawImage(blur, 0, 0);
  bctx.filter = 'none';

  // 캐릭터 알파 팽창 마스크 (8방향 오프셋 중첩)
  const D = Math.max(4, Math.round(w * 0.012));
  const mask = mkCanvas(w, h);
  const mctx = mask.getContext('2d');
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      mctx.drawImage(charCanvas, dx*D, dy*D);

  // 블러 이미지를 마스크로 잘라냄
  const patch = mkCanvas(w, h);
  const pctx = patch.getContext('2d');
  pctx.drawImage(blur, 0, 0);
  pctx.globalCompositeOperation = 'destination-in';
  pctx.drawImage(mask, 0, 0);

  // 원본 아트 위에 패치 덮기
  const bg = mkCanvas(w, h);
  const gctx = bg.getContext('2d');
  gctx.drawImage(art, 0, 0);
  gctx.drawImage(patch, 0, 0);
  return bg;
}

/* ═══════════════ STEP 4: 홀로 뷰어 (PixiJS) ═══════════════ */
let app = null, stageEl = $('stage');
let CARD_W = 300, CARD_H = 420;
let bgSprite, charSprite, frameSprite, sparkLayer, holoFilter, sparks = [];
let mode = 'mouse';
let pxMul = 1, tiltMul = 1, holoMul = 1, glareMul = 1, sparkMul = 1;
let spinA = 0;
let cur = { rx:0, ry:0, px:0.5, py:0.5 }, tgt = { rx:0, ry:0, px:0.5, py:0.5 };

function vpSize() {
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function fitStage() {
  if (!app) return;
  const { w, h } = vpSize();
  const s = Math.min(w*0.90 / CARD_W, h*0.90 / CARD_H);
  stageEl.style.width  = (CARD_W*s) + 'px';
  stageEl.style.height = (CARD_H*s) + 'px';
  const cv = $('pixi-canvas');
  cv.style.width = '100%';
  cv.style.height = '100%';
}
window.addEventListener('resize', fitStage);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);

async function launchViewer() {
  // 카드 비율 = 원본 이미지 비율
  CARD_W = 300;
  CARD_H = Math.round(300 * srcCanvas.height / srcCanvas.width);

  if (app) { app.destroy(true, { children: true }); app = null; }
  app = new Application();
  await app.init({
    canvas: $('pixi-canvas'),
    width: CARD_W, height: CARD_H,
    backgroundAlpha: 0, antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 3),
    autoDensity: true,
  });
  fitStage();
  setTimeout(fitStage, 300);

  const root = new Container();
  root.x = CARD_W/2; root.y = CARD_H/2;
  app.stage.addChild(root);
  const mask = new Graphics().roundRect(-CARD_W/2, -CARD_H/2, CARD_W, CARD_H, 12).fill(0xffffff);
  root.addChild(mask);
  root.mask = mask;
  root.sortableChildren = true;

  const [bgTex, charTex, frameTex] = await Promise.all([
    Assets.load(layers.bg.toDataURL('image/png')),
    Assets.load(layers.char.toDataURL('image/png')),
    Assets.load(layers.frame.toDataURL('image/png')),
  ]);

  // 아트창의 카드 좌표계 위치
  const winX = (win.x - 0.5 + win.w/2) * CARD_W;   // 창 중심 x (카드 중심 기준)
  const winY = (win.y - 0.5 + win.h/2) * CARD_H;
  const winW = win.w * CARD_W;
  const winH = win.h * CARD_H;
  const extScale = winW / (layers.bg.width - 2 * layers.bg.width * EXT_RATIO / (1 + 2*EXT_RATIO));
  // 단순화: 아트캔버스(확장 포함)를 창보다 EXT 비율만큼 크게 배치
  const artDispW = winW * (1 + 2*EXT_RATIO);

  bgSprite = new Sprite(bgTex);
  bgSprite.anchor.set(0.5);
  bgSprite.width = artDispW;
  bgSprite.height = artDispW * layers.bg.height / layers.bg.width;
  bgSprite.position.set(winX, winY);
  bgSprite.zIndex = 0;
  root.addChild(bgSprite);

  charSprite = new Sprite(charTex);
  charSprite.anchor.set(0.5);
  charSprite.width = bgSprite.width;
  charSprite.height = bgSprite.height;
  charSprite.position.set(winX, winY);
  charSprite.zIndex = 2;
  root.addChild(charSprite);

  frameSprite = new Sprite(frameTex);
  frameSprite.anchor.set(0.5);
  frameSprite.width = CARD_W;
  frameSprite.height = CARD_H;
  frameSprite.zIndex = 3;
  root.addChild(frameSprite);

  /* 홀로 셰이더 (v6과 동일 — 밝기 가중 가산) */
  const holoVert = `
    in vec2 aPosition; out vec2 vTextureCoord;
    uniform vec4 uInputSize; uniform vec4 uOutputFrame; uniform vec4 uOutputTexture;
    vec4 filterVertexPosition(void){
      vec2 position = aPosition * uOutputFrame.zw + uOutputFrame.xy;
      position.x = position.x * (2.0/uOutputTexture.x) - 1.0;
      position.y = position.y * (2.0*uOutputTexture.z/uOutputTexture.y) - uOutputTexture.z;
      return vec4(position, 0.0, 1.0);
    }
    vec2 filterTextureCoord(void){ return aPosition * (uOutputFrame.zw * uInputSize.zw); }
    void main(void){ gl_Position = filterVertexPosition(); vTextureCoord = filterTextureCoord(); }
  `;
  const holoFrag = `
    precision highp float;
    in vec2 vTextureCoord; out vec4 finalColor;
    uniform sampler2D uTexture;
    uniform vec2 uTilt; uniform float uTime;
    uniform float uBorderStrength; uniform float uGlareStrength;
    uniform vec2 uPointer;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5;
      for(int i=0;i<4;i++){ v += a*vnoise(p); p *= 2.1; a *= 0.5; }
      return v;
    }
    vec3 hsv2rgb(vec3 c){
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx+K.xyz)*6.0-K.www);
      return c.z * mix(K.xxx, clamp(p-K.xxx,0.0,1.0), c.y);
    }
    void main(void){
      vec4 src = texture(uTexture, vTextureCoord);
      vec2 uv = vTextureCoord;
      vec2 edge = min(uv, 1.0-uv);
      float borderMask = 1.0 - smoothstep(0.018, 0.05, min(edge.x, edge.y));
      vec2 flowUv = uv*7.0 + uTilt*1.6 + vec2(uTime*0.03, -uTime*0.02);
      float n = fbm(flowUv);
      float n2 = fbm(flowUv*1.7 + n*2.4);
      float hue = fract(n2*1.4 + uTilt.x*0.35 + uTilt.y*0.2);
      vec3 irid = hsv2rgb(vec3(hue, 0.55, 0.7 + n*0.3));
      float lum = dot(src.rgb, vec3(0.299, 0.587, 0.114));
      vec3 result = src.rgb + irid * borderMask * uBorderStrength * lum * 0.55;
      float angle = uTilt.x*0.9 + uTilt.y*0.5;
      float streak = uv.x*cos(angle) + uv.y*sin(angle);
      float band = pow(abs(sin(streak*2.6 + (uTilt.x+uTilt.y)*1.8)), 14.0);
      result += vec3(band) * uGlareStrength * 0.16;
      float d = length(uv - uPointer);
      result += vec3(exp(-d*3.2)) * uGlareStrength * 0.2;
      finalColor = vec4(result, src.a);
    }
  `;
  holoFilter = new Filter({
    glProgram: GlProgram.from({ vertex: holoVert, fragment: holoFrag }),
    resources: {
      holoUniforms: {
        uTilt: { value: new Float32Array([0,0]), type: 'vec2<f32>' },
        uTime: { value: 0, type: 'f32' },
        uBorderStrength: { value: 1.0, type: 'f32' },
        uGlareStrength: { value: 0.0, type: 'f32' },
        uPointer: { value: new Float32Array([0.5,0.5]), type: 'vec2<f32>' },
      }
    }
  });
  root.filters = [holoFilter];

  /* 스파클 */
  sparkLayer = new Container();
  sparkLayer.zIndex = 5;
  root.addChild(sparkLayer);
  sparks = [];
  for (let i = 0; i < 26; i++) {
    const size = 2 + Math.random()*5, w2 = size*0.22;
    const g = new Graphics();
    g.poly([0,-size, w2,-w2, size,0, w2,w2, 0,size, -w2,w2, -size,0, -w2,-w2])
     .fill({ color: [0xffffff, 0xfff2c0, 0xc8f4ff][i%3] });
    g.x = (Math.random()-0.5)*CARD_W*0.88;
    g.y = (Math.random()-0.5)*CARD_H*0.88;
    g.alpha = 0;
    sparkLayer.addChild(g);
    sparks.push({ g, phase: Math.random()*Math.PI*2, speed: 0.5+Math.random()*1.2, rot: (Math.random()-0.5)*0.02 });
  }

  /* 틱 */
  const U = holoFilter.resources.holoUniforms.uniforms;
  app.ticker.add(() => {
    U.uTime = performance.now()/1000;
    if (mode === 'spin') {
      spinA += 0.55;
      const ry = Math.sin(spinA*Math.PI/180)*20;
      const rx = Math.sin(spinA*0.62*Math.PI/180)*9;
      tgt = { rx, ry, px: (ry+20)/40, py: (rx+9)/18 };
    }
    const L = 0.15;
    cur.rx += (tgt.rx-cur.rx)*L; cur.ry += (tgt.ry-cur.ry)*L;
    cur.px += (tgt.px-cur.px)*L; cur.py += (tgt.py-cur.py)*L;
    const { rx, ry, px, py } = cur;
    stageEl.style.transform = `rotateX(${rx*tiltMul}deg) rotateY(${ry*tiltMul}deg)`;
    const dx = px-0.5, dy = py-0.5;
    bgSprite.position.set(winX + dx*-20*pxMul, winY + dy*-16*pxMul);
    charSprite.position.set(winX + dx*8*pxMul, winY + dy*5*pxMul);
    sparkLayer.position.set(dx*13*pxMul, dy*10*pxMul);
    U.uTilt[0] = dx*2; U.uTilt[1] = dy*2;
    U.uPointer[0] = px; U.uPointer[1] = py;
    U.uBorderStrength = holoMul;
    const activity = Math.min(1, (Math.abs(rx)+Math.abs(ry))/16);
    U.uGlareStrength = activity * glareMul;
    const t = performance.now()/1000;
    sparks.forEach(s => {
      const tw = Math.pow(Math.abs(Math.sin(t*s.speed + s.phase)), 3);
      s.g.alpha = tw * activity * sparkMul * 0.95;
      s.g.rotation += s.rot;
      s.g.scale.set(0.6 + tw*0.5);
    });
  });
}

/* 입력 */
const cv = $('pixi-canvas');
function fromPointer(cx, cy) {
  const r = cv.getBoundingClientRect();
  const px = Math.max(0, Math.min(1, (cx-r.left)/r.width));
  const py = Math.max(0, Math.min(1, (cy-r.top)/r.height));
  tgt = { rx: -(py-0.5)*24, ry: (px-0.5)*24, px, py };
}
cv.addEventListener('mousemove', e => { if(mode==='mouse') fromPointer(e.clientX, e.clientY); });
cv.addEventListener('mouseleave', () => { if(mode==='mouse') tgt = { rx:0, ry:0, px:0.5, py:0.5 }; });
cv.addEventListener('touchmove', e => {
  if(mode!=='mouse') return;
  e.preventDefault();
  fromPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
cv.addEventListener('touchend', () => { if(mode==='mouse') tgt = { rx:0, ry:0, px:0.5, py:0.5 }; });

function handleGyro(e) {
  if (mode !== 'gyro') return;
  const b = Math.max(-26, Math.min(26, (e.beta||0)-40));
  const g = Math.max(-26, Math.min(26, e.gamma||0));
  tgt = { rx: -b*0.8, ry: g*0.8, px: (g+26)/52, py: (b+26)/52 };
}
function setMode(m) {
  mode = m;
  ['mouse','gyro','spin'].forEach(x => $('m-'+x).classList.toggle('on', x===m));
  window.removeEventListener('deviceorientation', handleGyro);
  if (m === 'gyro') {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') { window.addEventListener('deviceorientation', handleGyro); closeSheet(); }
        else { showErr('자이로 권한 거부됨'); setMode('mouse'); }
      }).catch(() => { showErr('자이로 실패 — HTTPS 접속인지 확인'); setMode('mouse'); });
    } else {
      window.addEventListener('deviceorientation', handleGyro);
      closeSheet();
    }
  } else if (m !== 'spin') {
    tgt = { rx:0, ry:0, px:0.5, py:0.5 };
  }
}
$('m-mouse').addEventListener('click', () => setMode('mouse'));
$('m-gyro').addEventListener('click', () => setMode('gyro'));
$('m-spin').addEventListener('click', () => setMode('spin'));

function bindSlider(id, valId, cb) {
  const el = $(id);
  el.addEventListener('input', () => {
    $(valId).textContent = el.value;
    cb(parseInt(el.value)/100);
  });
}
bindSlider('s-px','v-px', v => pxMul = v);
bindSlider('s-tilt','v-tilt', v => tiltMul = v);
bindSlider('s-holo','v-holo', v => holoMul = v);
bindSlider('s-glare','v-glare', v => glareMul = v);
bindSlider('s-spark','v-spark', v => sparkMul = v);

/* 레이어 다운로드 */
function dl(canvas, name) {
  if (!canvas) return;
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}
$('dl-frame').addEventListener('click', () => dl(layers.frame, 'layer_frame.png'));
$('dl-char').addEventListener('click', () => dl(layers.char, 'layer_char.png'));
$('dl-bg').addEventListener('click', () => dl(layers.bg, 'layer_bg.png'));

/* 바텀시트 */
const sheet = $('sheet'), backdrop = $('backdrop');
function closeSheet() { sheet.classList.remove('show'); backdrop.classList.remove('show'); }
$('fab').addEventListener('click', () => {
  const open = sheet.classList.contains('show');
  open ? closeSheet() : (sheet.classList.add('show'), backdrop.classList.add('show'));
});
backdrop.addEventListener('click', closeSheet);
$('btn-new').addEventListener('click', () => { closeSheet(); showStep('drop'); });

console.log('✓ Card Splitter v0.2 ready');
